<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIMOTHY v2.0 Premium</title>
    <style>
        :root {
            --bg: #f3f4f6; --card: #ffffff; --primary: #2563eb; 
            --text: #111827; --sub: #6b7280; --accent: #eff6ff;
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; padding-bottom: 80px; }
        .app { max-width: 480px; margin: 0 auto; padding: 20px; }

        /* 언어 선택 (사진 1, 2 반영) */
        .lang-bar { background: var(--card); border-radius: 20px; padding: 15px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .lang-item { text-align: center; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .swap-btn { color: var(--primary); font-size: 1.2rem; cursor: pointer; }

        /* 메인 통역 카드 (사진 1 반영) */
        .main-card { background: var(--card); border-radius: 25px; padding: 30px 20px; text-align: center; margin-bottom: 15px; position: relative; }
        .online-tag { position: absolute; top: 15px; right: 15px; font-size: 0.65rem; color: #10b981; font-weight: bold; }
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: white; box-shadow: 0 10px 15px rgba(0,0,0,0.1); margin: 20px auto; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* 서브 버튼 (사진번역 / 상황별) */
        .sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .sub-btn { background: var(--card); border: none; border-radius: 18px; padding: 15px; font-weight: bold; display: flex; align-items: center; gap: 10px; cursor: pointer; }

        /* 결과창 (사진 4, 7 반영 - 가독성 극대화) */
        .result-card { background: var(--card); border-radius: 25px; padding: 25px; border-left: 6px solid var(--primary); margin-top: 15px; position: relative; }
        .res-target { font-size: 1.6rem; font-weight: bold; margin-bottom: 10px; }
        .res-pronun { color: var(--primary); font-weight: bold; font-size: 1rem; margin-bottom: 5px; }
        .res-tip { background: #fef3c7; color: #92400e; padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-top: 15px; line-height: 1.4; }

        /* 하단 입력바 */
        .input-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; padding: 12px 20px; box-sizing: border-box; display: flex; gap: 10px; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        .input-bar input { flex: 1; border: none; background: #f3f4f6; border-radius: 12px; padding: 12px; }

        /* 모달: 듣기 화면 (웨이브 포함) */
        #listenModal { display: none; position: fixed; inset: 0; background: white; z-index: 2000; padding: 40px 20px; text-align: center; }
        .wave { display: flex; justify-content: center; gap: 5px; height: 40px; align-items: center; margin: 30px 0; }
        .bar { width: 4px; height: 20px; background: var(--primary); border-radius: 2px; animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { height: 10px; } to { height: 40px; } }
    </style>
</head>
<body>

<div class="app">
    <div style="font-weight: 800; font-size: 1.2rem; margin-bottom: 20px;">TIMOTHY <span style="color:var(--primary); font-size:0.7rem;">v2.0 PREMIUM</span></div>

    <div class="lang-bar">
        <div class="lang-item">🇰🇷 한국어</div>
        <div class="swap-btn" onclick="swap()">⇄</div>
        <div class="lang-item">🇮🇹 이탈리아어</div>
    </div>

    <div class="main-card">
        <div class="online-tag">● ONLINE</div>
        <button class="mic-btn" onclick="startListen()"><span style="font-size: 2rem; color: var(--primary);">🎙️</span></button>
        <div style="color:var(--sub); font-size:0.85rem;">아이콘을 누르면 대화 시작</div>
    </div>

    <div class="sub-grid">
        <button class="sub-btn" onclick="alert('카메라 스캐닝 실행')"><span>📷</span> 사진번역</button>
        <button class="sub-btn" onclick="alert('상황별 리스트 호출')"><span>📙</span> 상황별</button>
    </div>

    <div id="result" class="result-card" style="display:none;">
        <div id="resTarget" class="res-target">Vorrei confermare la mia prenotazione.</div>
        <div id="resPronun" class="res-pronun">보레이 꼰뻬르마레 라 미아 쁘레노따찌오네.</div>
        <div id="resKo" style="color:var(--sub); font-size:0.9rem;">제 예약을 확인하고 싶습니다.</div>
        <div class="res-tip">💡 Gemini Tip: 이탈리아에서 'Vorrei'는 매우 정중한 표현입니다. 식당 예약 시 이 단어만 써도 아주 친절한 인상을 줄 수 있어요.</div>
        <button onclick="playVoice()" style="position:absolute; top:20px; right:20px; border:none; background:var(--accent); width:40px; height:40px; border-radius:50%; color:var(--primary);">🔊</button>
    </div>
</div>

<div class="input-bar">
    <input type="text" id="manualText" placeholder="직접 문장을 입력하세요...">
    <button onclick="manualTrans()" style="background:var(--text); color:white; border:none; padding:0 15px; border-radius:10px; font-weight:bold;">번역</button>
</div>

<div id="listenModal">
    <div style="color:var(--primary); font-weight:bold; font-size:0.8rem;">● LISTENING...</div>
    <h2 style="margin-top:10px;">한국어를 듣고 있습니다</h2>
    <div class="wave"><div class="bar"></div><div class="bar" style="animation-delay:0.2s"></div><div class="bar" style="animation-delay:0.1s"></div><div class="bar" style="animation-delay:0.3s"></div></div>
    <button onclick="finishListen()" style="width:100%; max-width:300px; background:var(--text); color:white; padding:15px; border-radius:15px; border:none; position:absolute; bottom:50px; left:50%; transform:translateX(-50%); font-weight:bold;">⏹️ 종료 및 번역하기</button>
</div>

<script>
    function startListen() { document.getElementById('listenModal').style.display = 'block'; }
    function finishListen() { 
        document.getElementById('listenModal').style.display = 'none';
        document.getElementById('result').style.display = 'block'; // 결과창 표시
    }
    function playVoice() {
        const txt = document.getElementById('resTarget').innerText;
        const msg = new SpeechSynthesisUtterance(txt);
        msg.lang = 'it-IT';
        window.speechSynthesis.speak(msg);
    }
    // 기타 스왑/입력 로직은 이전과 동일하게 확장 가능
</script>

</body>
</html>
