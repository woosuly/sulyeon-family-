<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIMOTHY Premium</title>
    <style>
        :root {
            --primary-blue: #2563eb; --bg-light: #f8fafc; --card-white: #ffffff;
            --text-dark: #1e293b; --text-gray: #64748b; --accent-blue: #dbeafe;
        }
        body { margin: 0; background: var(--bg-light); color: var(--text-dark); font-family: 'Pretendard', sans-serif; }
        .app-container { max-width: 480px; margin: 0 auto; padding: 20px; }

        /* 1. 언어 선택 카드 */
        .lang-card { background: var(--card-white); border-radius: 20px; padding: 20px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .lang-unit { text-align: center; font-size: 0.8rem; font-weight: bold; color: var(--text-gray); cursor: pointer; }
        .lang-unit img { width: 32px; display: block; margin: 0 auto 5px; }

        /* 2. 메인 통역 영역 */
        .interpret-box { background: var(--card-white); border-radius: 30px; padding: 40px 20px; text-align: center; margin-bottom: 20px; position: relative; }
        .status-dot { position: absolute; top: 20px; right: 20px; font-size: 0.75rem; color: #10b981; font-weight: bold; }
        .mic-btn-main { width: 90px; height: 90px; border-radius: 50%; border: 8px solid var(--bg-light); background: white; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); cursor: pointer; margin-bottom: 15px; }
        
        /* 3. 서브 메뉴 (사진번역/상황별) */
        .sub-menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .sub-btn { background: var(--card-white); border-radius: 20px; padding: 15px; display: flex; align-items: center; gap: 12px; font-weight: bold; border: none; cursor: pointer; }
        .icon-circle { width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        /* 4. 번역 결과창 (사진 4, 7 참조) */
        .result-card { background: var(--card-white); border-radius: 25px; padding: 25px; border-left: 6px solid var(--primary-blue); position: relative; display: none; }
        .target-text { font-size: 1.5rem; font-weight: 800; margin-bottom: 15px; }
        .pronun-text { color: var(--primary-blue); font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .tip-box { background: #fffbeb; border-radius: 12px; padding: 12px; font-size: 0.8rem; color: #b45309; line-height: 1.4; margin-top: 15px; }

        /* 5. 하단 직접입력 바 */
        .input-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; padding: 15px; box-sizing: border-box; display: flex; gap: 10px; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        .input-field { flex: 1; background: #f1f5f9; border: none; border-radius: 12px; padding: 12px; }

        /* 모달 레이어 (언어선택/듣기/카메라) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; }
        .bottom-sheet { position: absolute; bottom: 0; width: 100%; background: white; border-radius: 30px 30px 0 0; padding: 30px 20px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="lang-card">
        <div class="lang-unit" onclick="openModal('langModal')">🇰🇷<br>KOR</div>
        <div style="color:var(--primary-blue); font-size:1.2rem;">⇄</div>
        <div class="lang-unit" onclick="openModal('langModal')">🇮🇹<br>ITA</div>
    </div>

    <div class="interpret-box">
        <div class="status-dot">● ONLINE</div>
        <button class="mic-btn-main" onclick="openModal('listenModal')">
            <span style="font-size: 2.5rem; color: var(--primary-blue);">🎙️</span>
        </button>
        <div style="color:var(--text-gray); font-size:0.9rem;">아이콘을 누르면 대화 시작</div>
    </div>

    <div class="sub-menu-grid">
        <button class="sub-btn" onclick="openModal('camModal')">
            <div class="icon-circle" style="background:var(--accent-blue);">📷</div> 사진번역
        </button>
        <button class="sub-btn" onclick="location.href='#situ'">
            <div class="icon-circle" style="background:#fef3c7;">📑</div> 상황별
        </button>
    </div>

    <div id="resultArea" class="result-card" style="display: block;">
        <div class="target-text">Buongiorno!</div>
        <div class="pronun-text">본 조르노!</div>
        <div style="color:var(--text-gray); font-size:0.9rem;">좋은 아침입니다!</div>
        <div class="tip-box">
            💡 팁: 이 인사는 보통 정오(12시) 전까지만 사용해요.
        </div>
        <button style="position:absolute; top:25px; right:20px; border:none; background:#eff6ff; width:40px; height:40px; border-radius:50%; color:var(--primary-blue);">🔊</button>
    </div>
</div>

<div class="input-bar">
    <input type="text" class="input-field" placeholder="직접 문장을 입력하세요...">
    <button style="background:var(--text-dark); color:white; border:none; border-radius:12px; padding:0 20px;">번역</button>
</div>

<div id="listenModal" class="modal-overlay" onclick="closeModal('listenModal')">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div style="text-align:center; margin-bottom:30px;">
            <div style="color:var(--primary-blue); font-weight:bold; font-size:0.8rem; margin-bottom:10px;">● LISTENING...</div>
            <h2 style="margin:0;">한국어를 듣고 있습니다</h2>
            <div style="color:var(--text-gray); font-size:0.9rem; margin-top:5px;">"이탈리아어로 통역 준비됨"</div>
        </div>
        <div style="display:flex; justify:center; gap:8px; height:60px; align-items:center;">
             <div style="width:4px; height:30px; background:var(--primary-blue); border-radius:2px;"></div>
             <div style="width:4px; height:50px; background:var(--primary-blue); border-radius:2px;"></div>
             <div style="width:4px; height:40px; background:var(--primary-blue); border-radius:2px;"></div>
        </div>
        <button style="width:100%; background:var(--text-dark); color:white; padding:18px; border-radius:15px; border:none; margin-top:30px; font-weight:bold; font-size:1rem;">
            ⏹️ 종료 및 번역하기
        </button>
    </div>
</div>

<script>
    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>

</body>
</html>
