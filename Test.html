<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TIMOTHY v2.0 Premium</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --sub: #94a3b8; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        .app { max-width: 480px; width: 100%; margin: 0 auto; padding: 15px; flex: 1; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; padding-bottom: 120px; }
        
        /* 1. 헤더 & 설정 */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .gear-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; }

        /* 2. 언어 선택 (KR/IT 영문 표기 삭제) */
        .card { background: var(--card); border-radius: 20px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); margin-bottom: 10px; position: relative; }
        .lang-bar { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; }
        .lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .lang-item { padding: 12px 5px; border: 1px solid #eee; border-radius: 12px; text-align: center; cursor: pointer; display: flex; flex-direction: column; }
        .lang-item.active { background: var(--primary); color: white; border-color: var(--primary); }
        .lang-ko-name { font-weight: bold; font-size: 0.9rem; }
        .lang-en-name { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
        .lang-item.active .lang-en-name { color: rgba(255,255,255,0.7); }

        /* 3. 마이크 섹션 (성별 버튼 제거) */
        .mic-section { text-align: center; padding: 30px 15px; }
        .mic-btn { width: 75px; height: 75px; border-radius: 50%; border: none; background: white; box-shadow: 0 8px 15px rgba(0,0,0,0.1); cursor: pointer; font-size: 2rem; }
        .wave-container { display: none; align-items: center; justify-content: center; gap: 5px; height: 40px; margin: 15px 0; }
        .wave-bar { width: 4px; height: 10px; background: var(--primary); border-radius: 2px; animation: wave 1s infinite ease-in-out; }
        @keyframes wave { 0%, 100% { height: 10px; } 50% { height: 40px; } }
        .stop-btn { display: none; width: 100%; background: #1e293b; color: white; border: none; padding: 15px; border-radius: 15px; font-weight: bold; margin-top: 15px; cursor: pointer; }

        /* 4. 카메라/상황 버튼 */
        .sub-btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .sub-btn { flex: 1; background: var(--card); border: none; border-radius: 18px; padding: 15px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.03); }

        /* 5. 카메라 뷰파인더 (외부 불투명, 내부 투명) */
        #camLayer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; }
        .viewfinder { width: 80%; height: 35%; border: 2px solid #10b981; border-radius: 20px; position: relative; background: transparent; box-shadow: 0 0 0 5000px rgba(0,0,0,0.7); }
        .scan-line { width: 100%; height: 2px; background: #10b981; position: absolute; top: 0; animation: scan 4s infinite linear; box-shadow: 0 0 10px #10b981; }
        @keyframes scan { to { top: 100%; } }

        /* 6. 결과 배너 (복구) */
        .result-box { border-left: 6px solid var(--primary); display: none; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .res-target { font-size: 1.5rem; font-weight: 800; padding-right: 45px; line-height: 1.2; }
        .res-ko { color: var(--sub); font-size: 0.8rem; margin: 5px 0; }
        .res-pronun { color: var(--primary); font-weight: bold; font-size: 1.05rem; }
        .res-tip { background: #fffbeb; color: #92400e; padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-top: 15px; line-height: 1.5; }

        /* 7. 상황별 모달 & 리스트 */
        .situ-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; }
        .tab-btn { padding: 8px 0; border: none; border-radius: 8px; font-size: 0.75rem; background: #eee; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; }
        #situList { max-height: 280px; overflow-y: auto; }

        /* 하단바 */
        .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; padding: 12px 15px; display: flex; gap: 8px; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
        #manualInput { flex: 1; border: none; background: #f1f5f9; border-radius: 12px; padding: 12px; font-size: 1rem; outline: none; }
        .send-btn { background: #1e293b; color: white; border: none; border-radius: 12px; padding: 0 18px; font-weight: bold; cursor: pointer; }

        /* 모달 공통 */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9000; backdrop-filter: blur(4px); }
        .modal-content { position: absolute; bottom: 0; width: 100%; max-width: 480px; left: 50%; transform: translateX(-50%); background: white; border-radius: 30px 30px 0 0; padding: 25px; box-sizing: border-box; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-x { font-size: 1.5rem; background: none; border: none; cursor: pointer; color: var(--sub); }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div style="font-weight:900;">TIMOTHY <span style="color:var(--primary); font-size:0.7rem;">v2.0 PREMIUM</span></div>
        <button class="gear-btn" onclick="openModal('settingsModal')">⚙️</button>
    </div>

    <div class="card lang-bar" onclick="openModal('langModal')">
        <span id="curStartDisp">한국어</span> <span style="color:var(--primary)">⇄</span> <span id="curEndDisp">이탈리아어</span>
    </div>

    <div class="card mic-section">
        <div class="wave-container" id="waveBox">
            <div class="wave-bar" style="animation-delay: 0.1s"></div>
            <div class="wave-bar" style="animation-delay: 0.3s"></div>
            <div class="wave-bar" style="animation-delay: 0.2s"></div>
            <div class="wave-bar" style="animation-delay: 0.4s"></div>
        </div>
        <button class="mic-btn" id="micBtn" onclick="startListening()">🎙️</button>
        <div id="micStatus" style="font-size:0.85rem; color:var(--sub); margin-top:10px;">아이콘을 누르면 대화 시작</div>
        <button class="stop-btn" id="stopBtn" onclick="stopAndTranslate()">⏹️ 종료 및 통역하기</button>
    </div>

    <div class="sub-btn-row">
        <button class="sub-btn" onclick="openCam()">📷 사진번역</button>
        <button class="sub-btn" onclick="openModal('situModal')">📙 상황별</button>
    </div>

    <div id="resultCard" class="card result-box">
        <div id="targetTxt" class="res-target"></div>
        <div id="koTxt" class="res-ko"></div>
        <div id="pronunTxt" class="res-pronun"></div>
        <div id="tipTxt" class="res-tip"></div>
        <button onclick="speakResult()" style="position:absolute; top:18px; right:18px; border:none; background:#eff6ff; width:42px; height:42px; border-radius:50%; color:var(--primary); font-size:1.2rem; cursor:pointer;">🔊</button>
    </div>
</div>

<div class="bottom-bar">
    <input type="text" id="manualInput" placeholder="직접 문장을 입력하세요...">
    <button class="send-btn" onclick="handleManualTrans()">번역</button>
</div>

<div id="settingsModal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3>API 보안 설정</h3><button class="close-x" onclick="closeModal('settingsModal')">✕</button></div>
    <input type="password" id="geminiKeyInput" style="width:100%; padding:12px; border-radius:12px; border:1px solid #ddd; box-sizing:border-box;" placeholder="Gemini API Key 입력">
    <button onclick="saveApiKeys()" style="width:100%; background:var(--primary); color:white; border:none; padding:15px; border-radius:12px; margin-top:15px; font-weight:bold;">설정 저장하기</button>
</div></div>

<div id="langModal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3>번역 언어 선택</h3><button class="close-x" onclick="closeModal('langModal')">✕</button></div>
    <div class="lang-grid" id="langGrid"></div>
</div></div>

<div id="situModal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3>상황별 문장</h3><button class="close-x" onclick="closeModal('situModal')">✕</button></div>
    <div class="situ-grid" id="situTabs"></div>
    <div id="situList"></div>
</div></div>

<div id="camLayer">
    <div class="viewfinder"><div class="scan-line"></div></div>
    <button onclick="closeCam()" style="position:absolute; top:30px; right:30px; color:white; background:none; border:none; font-size:2rem; cursor:pointer;">✕</button>
    <div style="position:absolute; bottom:50px; display:flex; gap:15px;">
        <label style="padding:15px 25px; border-radius:30px; background:white; font-weight:bold; cursor:pointer; font-size:0.9rem;">📁 사진 업로드<input type="file" style="display:none;" onchange="closeCam(); handleManualTrans('사진 분석 중...');"></label>
        <button onclick="closeCam(); handleManualTrans('이미지 스캔 분석 중...');" style="padding:15px 25px; border-radius:30px; border:none; background:var(--primary); color:white; font-weight:bold;">📸 촬영번역</button>
    </div>
</div>

<script>
    const languages = [
        {id:'ko', name:'한국어', en:'korean', flag:'🇰🇷'}, {id:'en-US', name:'영어', en:'english', flag:'🇺🇸'}, {id:'it', name:'이탈리아어', en:'italian', flag:'🇮🇹'},
        {id:'ja', name:'일어', en:'japanese', flag:'🇯🇵'}, {id:'zh', name:'중국어', en:'chinese', flag:'🇨🇳'}, {id:'fr', name:'프랑스어', en:'french', flag:'🇫🇷'},
        {id:'es', name:'스페인어', en:'spanish', flag:'🇪🇸'}, {id:'vi', name:'베트남어', en:'vietnamese', flag:'🇻🇳'}, {id:'th', name:'태국어', en:'thai', flag:'🇹🇭'}
    ];
    const categories = ["식당", "호텔", "공항", "병원", "관광지", "상점", "쇼핑", "배달", "경찰서", "옷가게"];
    let currentTargetLang = 'it';

    // 1. 초기화
    window.onload = () => {
        const grid = document.getElementById('langGrid');
        languages.forEach(l => {
            const div = document.createElement('div');
            div.className = `lang-item ${l.id === currentTargetLang ? 'active' : ''}`;
            div.innerHTML = `<span class="lang-ko-name">${l.name}</span><span class="lang-en-name">${l.en}</span>`;
            div.onclick = () => {
                currentTargetLang = l.id;
                document.querySelectorAll('.lang-item').forEach(i => i.classList.remove('active'));
                div.classList.add('active');
                document.getElementById('curEndDisp').innerText = l.name;
                closeModal('langModal');
            };
            grid.appendChild(div);
        });

        const tabs = document.getElementById('situTabs');
        categories.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            btn.innerText = c;
            btn.onclick = () => loadPhrases(c);
            tabs.appendChild(btn);
        });

        const savedKey = localStorage.getItem('GEMINI_API_KEY');
        if(savedKey) document.getElementById('geminiKeyInput').value = savedKey;
    };

    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function openCam() { document.getElementById('camLayer').style.display = 'flex'; }
    function closeCam() { document.getElementById('camLayer').style.display = 'none'; }

    // 2. 마이크 로직
    let recognition;
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'ko-KR';
    }

    function startListening() {
        if (!recognition) return alert("브라우저 미지원");
        document.getElementById('micBtn').style.display = 'none';
        document.getElementById('waveBox').style.display = 'flex';
        document.getElementById('stopBtn').style.display = 'block';
        document.getElementById('micStatus').innerText = "듣고 있습니다...";
        recognition.start();
    }

    function stopAndTranslate() {
        recognition.stop();
        document.getElementById('micBtn').style.display = 'inline-block';
        document.getElementById('waveBox').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('micStatus').innerText = "아이콘을 누르면 대화 시작";
    }

    recognition.onresult = (e) => {
        const last = e.results[e.results.length - 1];
        if (last.isFinal) handleManualTrans(last[0].transcript);
    };

    // 3. 상황별 리스트 (15개)
    function loadPhrases(cat) {
        const list = document.getElementById('situList');
        list.innerHTML = "";
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText === cat));
        for(let i=1; i<=15; i++) {
            const div = document.createElement('div');
            div.style = "background:#f8fafc; padding:15px; border-radius:15px; margin-bottom:10px; position:relative; border:1px solid #eee;";
            div.innerHTML = `
                <div style="font-size:0.75rem; color:#666;">[${cat}] 문장 ${i}</div>
                <div style="font-weight:bold; margin-top:3px;">번역을 위해 클릭하세요.</div>
                <button onclick="handleManualTrans('${cat} 관련 ${i}번 문장')" style="position:absolute; top:15px; right:15px; border:none; background:none; font-size:1.2rem; cursor:pointer;">🔊</button>
            `;
            list.appendChild(div);
        }
    }

    // 4. 번역 엔진 (Gemini 단일화)
    async function handleManualTrans(input) {
        const text = input || document.getElementById('manualInput').value;
        if (!text) return;
        closeModal('situModal');

        document.getElementById('resultCard').style.display = 'block';
        document.getElementById('targetTxt').innerText = "AI 분석 중...";
        document.getElementById('koTxt').innerText = text;
        document.getElementById('pronunTxt').innerText = "";
        document.getElementById('tipTxt').innerText = "";

        const prompt = `Translate "${text}" to ${document.getElementById('curEndDisp').innerText}. 
            Respond ONLY in JSON: {"target":"Translated Text", "pronun":"Korean Pronunciation", "tip":"Travel Tip"}`;

        const response = await callGeminiAPI(prompt);
        if (response) {
            try {
                const data = JSON.parse(response);
                document.getElementById('targetTxt').innerText = data.target;
                document.getElementById('pronunTxt').innerText = data.pronun;
                document.getElementById('tipTxt').innerText = "💡 Gemini Tip: " + data.tip;
                speakResult();
            } catch(e) { document.getElementById('targetTxt').innerText = "오류 발생"; }
        }
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    async function callGeminiAPI(prompt) {
        const apiKey = localStorage.getItem('GEMINI_API_KEY');
        if(!apiKey) { openModal('settingsModal'); return null; }
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
            const data = await res.json();
            return data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
        } catch(e) { return null; }
    }

    function saveApiKeys() { localStorage.setItem('GEMINI_API_KEY', document.getElementById('geminiKeyInput').value); alert("저장됨"); closeModal('settingsModal'); }
    function speakResult() {
        const text = document.getElementById('targetTxt').innerText;
        if(!text || text.includes("분석")) return;
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = currentTargetLang;
        window.speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
