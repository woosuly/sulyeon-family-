<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TIMOTHY v2.0 Premium</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        .app { max-width: 480px; width: 100%; margin: 0 auto; padding: 15px; flex: 1; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
        
        /* 카드 및 레이아웃 */
        .card { background: var(--card); border-radius: 20px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); }
        .flex-row { display: flex; gap: 10px; }
        .sub-btn { flex: 1; background: var(--card); border: none; border-radius: 15px; padding: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.03); font-size: 0.9rem; }

        /* 결과창 (간격 조절) */
        .result-box { border-left: 6px solid var(--primary); display: none; position: relative; margin-top: 5px; }
        .tip-area { background: #fffbeb; color: #92400e; padding: 10px; border-radius: 12px; font-size: 0.8rem; margin-top: 10px; }

        /* 성별 선택 */
        .gender-toggle { display: flex; gap: 10px; justify-content: center; font-size: 0.8rem; margin-top: 5px; }
        .gender-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid #ddd; background: white; cursor: pointer; }
        .gender-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* 카메라 반투명 스캔 */
        #scanOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 5000; display: none; align-items: center; justify-content: center; }
        .viewfinder { width: 80%; height: 40%; border: 2px solid #10b981; border-radius: 15px; background: transparent; position: relative; box-shadow: 0 0 0 5000px rgba(0,0,0,0.6); }
        .scan-line { width: 100%; height: 2px; background: #10b981; position: absolute; top: 0; animation: scan 2s infinite linear; }
        @keyframes scan { to { top: 100%; } }

        /* 상황별 10개 버튼 그리드 */
        .situ-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 10px; }
        .situ-tab { padding: 8px 2px; border-radius: 8px; border: none; background: #eee; font-size: 0.7rem; cursor: pointer; }
        .situ-tab.active { background: var(--primary); color: white; }

        /* 문장 리스트 */
        .phrase-item { background: white; padding: 12px; border-radius: 12px; border-bottom: 1px solid #f1f5f9; margin-bottom: 8px; position: relative; font-size: 0.9rem; }

        /* 하단바 고정 */
        .bottom-bar { position: sticky; bottom: 0; background: white; padding: 12px 15px; display: flex; gap: 8px; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        input { flex: 1; border: none; background: #f1f5f9; border-radius: 10px; padding: 12px; font-size: 1rem; }
        .send-btn { background: #1e293b; color: white; border: none; border-radius: 10px; padding: 0 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app">
    <div style="font-weight: 900; font-size: 1.1rem; padding-top: 10px;">TIMOTHY <span style="color:var(--primary); font-size: 0.7rem;">v2.0 PREMIUM</span></div>

    <div class="card flex-row" style="justify-content: space-between; align-items: center;" onclick="alert('언어 선택 모달')">
        <span>🇰🇷 한국어</span> <span style="color:var(--primary)">⇄</span> <span>🇮🇹 이탈리아어</span>
    </div>

    <div class="card" style="text-align: center; padding: 25px 15px;">
        <div style="text-align: right; color: #10b981; font-size: 0.65rem; font-weight: bold;">● ONLINE</div>
        <button onclick="alert('듣기 시작')" style="width:70px; height:70px; border-radius:50%; border:none; background:white; box-shadow: 0 8px 15px rgba(0,0,0,0.1); cursor: pointer; margin: 10px 0;">🎙️</button>
        <div class="gender-toggle">
            <button class="gender-btn active" onclick="setGender('F')">여성 목소리</button>
            <button class="gender-btn" onclick="setGender('M')">남성 목소리</button>
        </div>
    </div>

    <div class="flex-row">
        <button class="sub-btn" onclick="openScan()">📷 사진번역</button>
        <button class="sub-btn" onclick="showSitu()">📙 상황별</button>
    </div>

    <div id="situArea" class="card" style="display:none;">
        <div class="situ-grid">
            <button class="situ-tab active">식당</button><button class="situ-tab">호텔</button>
            <button class="situ-tab">병원</button><button class="situ-tab">공항</button>
            <button class="situ-tab">관광지</button><button class="situ-tab">상점</button>
            <button class="situ-tab">쇼핑</button><button class="situ-tab">배달</button>
            <button class="situ-tab">경찰서</button><button class="situ-tab">옷가게</button>
        </div>
        <div id="phraseList" style="max-height: 200px; overflow-y: auto;">
            <div class="phrase-item">
                <div style="font-size:0.7rem; color:#666;">계산서 부탁합니다.</div>
                <div style="font-weight:bold;">Il conto, per favore.</div>
                <button onclick="alert('음성 재생')" style="position:absolute; top:10px; right:10px; border:none; background:none; font-size:1.1rem;">🔊</button>
            </div>
        </div>
    </div>

    <div id="resultCard" class="card result-box">
        <div id="targetTxt" style="font-size: 1.4rem; font-weight: 800; margin-bottom: 5px;">Vorrei confermare...</div>
        <div id="pronunTxt" style="color: var(--primary); font-weight: bold; font-size: 0.95rem; margin-bottom: 3px;">보레이 꼰뻬르마레...</div>
        <div id="koTxt" style="color: #64748b; font-size: 0.85rem;">제 예약을 확인하고 싶습니다.</div>
        <div class="tip-area">💡 Gemini Tip: 'Vorrei'는 매우 정중한 표현입니다.</div>
        <button onclick="alert('음성 재생')" style="position:absolute; top:15px; right:15px; border:none; background:#eff6ff; width:40px; height:40px; border-radius:50%; color:var(--primary);">🔊</button>
    </div>
</div>

<div class="bottom-bar">
    <input type="text" id="manualInput" placeholder="직접 문장을 입력하세요...">
    <button class="send-btn" onclick="manualTrans()">번역</button>
</div>

<div id="scanOverlay" onclick="closeScan()">
    <div class="viewfinder" onclick="event.stopPropagation()">
        <div class="scan-line"></div>
    </div>
    <div style="position: absolute; bottom: 40px; display: flex; gap: 20px;">
        <button onclick="alert('갤러리 열기')" style="padding: 12px 25px; border-radius: 25px; border:none; background:white; font-weight:bold;">🖼️ 사진 첨부</button>
        <button onclick="closeScan(); manualTrans();" style="padding: 12px 25px; border-radius: 25px; border:none; background:var(--primary); color:white; font-weight:bold;">📸 촬영번역</button>
    </div>
</div>

<script>
    function openScan() { document.getElementById('scanOverlay').style.display = 'flex'; }
    function closeScan() { document.getElementById('scanOverlay').style.display = 'none'; }
    function showSitu() { 
        const area = document.getElementById('situArea');
        area.style.display = (area.style.display === 'none') ? 'block' : 'none';
    }
    function manualTrans() {
        document.getElementById('resultCard').style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }
    function setGender(g) {
        document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }
</script>

</body>
</html>
